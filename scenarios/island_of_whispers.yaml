# ── Recipes ────────────────────────────────────────────────────
recipes:
  - output_item_id: "bandage"
    inputs: {cloth_scrap: 2}

  - output_item_id: "stone_spear"
    inputs: {sharp_stone: 1, bamboo: 1, vine: 1}

  - output_item_id: "torch"
    inputs: {bamboo: 1, cloth_scrap: 1, sulfur_stone: 1}
    requires_location_tag: null

  - output_item_id: "signal_fire"
    inputs: {rope: 1, sulfur_stone: 2, cloth_scrap: 1}
    requires_location_tag: "high_ground"

  - output_item_id: "antidote"
    inputs: {rare_herb: 2, plastic_bottle: 1}

  - output_item_id: "escape_raft"
    inputs: {bamboo: 3, rope: 2, cloth_scrap: 2}
    requires_location_tag: "water_source"

# ── Knowledge Sources ──────────────────────────────────────────
# acquisition: search = 搜索该地点时按 weight 概率习得
#              arrive = 首次到达该地点时习得
#              craft  = 合成出指定物品时习得
#              event  = 由事件或角色技能授予
# grants_knowledge 中的 flag 可供胜利条件 required_knowledge 引用；
# stat_bonus 提供永久属性成长（如赛博朋克剧本中的脑机接口植入）。
knowledge_sources:
  - id: "insect_alpha"
    name: "阿尔法虫群习性"
    description: "你观察到了阿尔法虫群的觅食模式，掌握了它们的行动规律。"
    acquisition: "search"
    location_id: "jungle_edge"
    weight: 0.6
    grants_knowledge: ["insect_alpha"]

  - id: "insect_beta"
    name: "贝塔虫群迁徙"
    description: "洞穴中的贝塔虫群揭示了岛屿生态的迁徙秘密，你的预判能力提升了。"
    acquisition: "search"
    location_id: "dark_cave"
    weight: 0.6
    grants_knowledge: ["insect_beta"]
    stat_bonus: {attack: 2}

  - id: "insect_gamma"
    name: "伽马虫群毒素"
    description: "圣林中的伽马虫群教会了你解读昆虫毒素与信息素。"
    acquisition: "search"
    location_id: "sacred_grove"
    weight: 0.6
    grants_knowledge: ["insect_gamma"]

  - id: "first_aid"
    name: "野外急救术"
    description: "亲手制作绷带让你掌握了基础的野外急救技巧。"
    acquisition: "craft"
    item_id: "bandage"
    grants_knowledge: ["first_aid"]

  - id: "ruins_inscription"
    name: "遗迹铭文解读"
    description: "你能读懂远古文明留下的铭文，它们似乎能增强你的防御直觉。"
    acquisition: "arrive"
    location_id: "ancient_ruins"
    grants_knowledge: ["ruins_inscription"]
    stat_bonus: {defense: 2}

# ── Characters ─────────────────────────────────────────────────
characters:
  - id: "ex_soldier"
    name: "雷·卡特"
    backstory: |
      前海豹突击队员，在一次秘密任务中遭遇风暴被冲上这座岛屿。
      你的身体是你最强的武器——多年训练赋予了你超凡的战斗本能。
      但你也知道，在这座岛上，蛮力未必是最终的答案。
    narration_style: "冷静警觉的军人视角：多用战斗直觉、威胁评估、身体记忆等措辞，短促有力。"
    focus: "你更在意威胁与战术：关注其他幸存者的动向、武器的优劣、可伏击的时机与地形，以及自身的战斗状态。"
    base_stats:
      hp: 120
      max_hp: 120
      stamina: 100
      max_stamina: 100
      attack: 18
      defense: 12
      speed: 8
    start_location: "beach_camp"
    start_inventory: {rusty_knife: 1}
    personal_objective:
      description: "你是唯一知道这座岛屿军事秘密的人。消灭所有其他幸存者，确保秘密不会外泄。"
      trigger: {kind: "eliminate_all", params: {}}
      victory: true
    abilities:
      - id: "quick_strike"
        name: "迅捷突刺"
        description: "消耗体力发动一次迅猛的突刺，造成 12 点伤害。"
        stamina_cost: 15
        cooldown_rounds: 3
        target: "single"
        effects:
          - {type: damage, target: single, amount: 12}

  - id: "entomologist"
    name: "林·薇拉"
    backstory: |
      昆虫学家，为了追寻一种据说只在这座岛屿上存在的远古昆虫而来。
      你的战斗力不强，但你对岛上生态系统的理解是无人能及的。
      如果你能研究并控制那些神秘昆虫，也许能逆转整个局势。
    narration_style: "细致的科学家视角：多用昆虫、生态、信息素、捕食者与猎物等观察性措辞，理性分析。"
    focus: "你更在意生态与昆虫：关注各区域的特殊昆虫线索、生态规律、可研究的对象，以及如何利用虫群逆转局势。"
    base_stats:
      hp: 80
      max_hp: 80
      stamina: 120
      max_stamina: 120
      attack: 6
      defense: 6
      speed: 10
    start_location: "jungle_edge"
    start_inventory: {herb: 2}
    personal_objective:
      description: "研究岛上的三种特殊昆虫（通过搜索特定地点获取知识），学会控制它们的方法，用昆虫的力量消灭或威慑所有其他幸存者。"
      trigger:
        kind: "custom_flag"
        params: {required_knowledge: ["insect_alpha", "insect_beta", "insect_gamma"]}
      victory: true
    abilities:
      - id: "summon_swarm"
        name: "虫群召来"
        description: "以你的昆虫知识驱使虫群袭击同区域的一名对手，使其所在区域遭受虫群袭击。"
        stamina_cost: 20
        cooldown_rounds: 5
        target: "single"
        effects:
          - {type: trigger_event, event_id: swarm_summoned}

  - id: "archaeologist"
    name: "陈·哈维"
    backstory: |
      考古学家，对这座岛屿上的远古文明着迷已久。
      你相信遗迹中隐藏着离开这里的关键——那座塔楼也许能发送求救信号。
      收集石板铭文和关键零件，在所有人之前发出求救信号。
    narration_style: "考据的考古学家视角：多用遗迹、铭文、古老线索、文明谜题等措辞，求知欲强。"
    focus: "你更在意遗迹与文明：关注石板铭文、发射器零件、古代机关，以及通往塔楼顶端求救信号的线索。"
    base_stats:
      hp: 90
      max_hp: 90
      stamina: 110
      max_stamina: 110
      attack: 8
      defense: 8
      speed: 9
    start_location: "ancient_ruins"
    start_inventory: {}
    personal_objective:
      description: "收集2块石板铭文(stone_tablet)、1个损坏的发射器(broken_transmitter)和1个电池(battery)，到达塔楼顶端(tower_top)发出求救信号。"
      trigger:
        kind: "collect_items"
        params: {item_ids: ["stone_tablet", "broken_transmitter", "battery"], at_location: "tower_top"}
      victory: true
    abilities:
      - id: "decipher"
        name: "铭文解读"
        description: "解读遗迹铭文，永久提升 2 点防御。"
        stamina_cost: 12
        cooldown_rounds: 4
        target: "self"
        effects:
          - {type: grant_knowledge, source: ruins_inscription, target: self}

  - id: "mysterious_stranger"
    name: "???"
    backstory: |
      你不记得自己是谁。醒来时已经在岛屿的洞穴深处。
      那些发光的苔藓似乎在对你低语，祭坛上的器物呼唤着你。
      也许答案在火山口——那里是一切的源头。
    narration_style: "恍惚的神秘视角：多用低语、梦境、超自然、被牵引等措辞，朦胧而宿命。"
    focus: "你更在意超自然与本源：关注发光的苔藓、祭坛的器物、火山口的心跳，以及岛屿低语指引你去往的方向。"
    base_stats:
      hp: 100
      max_hp: 100
      stamina: 100
      max_stamina: 100
      attack: 12
      defense: 8
      speed: 12
    start_location: "dark_cave"
    start_inventory: {glowing_moss: 1}
    personal_objective:
      description: "获取仪式器物(ritual_artifact)和火山之心(volcanic_core)，到达火山口完成远古仪式，唤醒岛屿的力量。"
      trigger:
        kind: "custom_flag"
        params: {required_items: ["ritual_artifact", "volcanic_core"], at_location: "volcano_crater"}
      victory: true
    abilities:
      - id: "shadow_strike"
        name: "暗影打击"
        description: "以岛屿的低语为媒介发动袭击，造成 18 点伤害并使目标中毒。"
        stamina_cost: 25
        cooldown_rounds: 4
        target: "single"
        effects:
          - {type: damage, target: single, amount: 18}
          - {type: status, target: single, status: poison, rounds: 2, magnitude: 3}

# ── Random Events ──────────────────────────────────────────────
# 每回合结束时按权重从"已到触发回合且未达触发上限"的事件中抽一个触发。
# 技能可通过 trigger_event 效果强制触发指定事件（无视 round_trigger，
# 但仍受 max_fires 限制）。round_trigger: null 表示只能由技能触发。
random_events:
  - id: "tropical_storm"
    name: "热带风暴"
    description: "一场突如其来的暴风雨席卷了岛屿。"
    round_trigger: 6
    weight: 1.0
    repeatable: true
    max_fires: 3
    effects:
      - {type: damage, target: at_location, location_id: beach_camp, amount: 6}
      - {type: damage, target: at_location, location_id: rocky_shore, amount: 6}
      - {type: stamina, target: all, amount: -10}
    narrative_seed: "暴风雨突然降临，狂风暴雨让所有人都难以行动。"

  - id: "insect_swarm"
    name: "虫群来袭"
    description: "一大群不明昆虫从丛林深处涌出。"
    round_trigger: 10
    weight: 1.0
    repeatable: true
    max_fires: 2
    effects:
      - {type: damage, target: at_location, location_id: jungle_edge, amount: 8}
      - {type: status, target: at_location, location_id: jungle_edge, status: poison, rounds: 3, magnitude: 3}
    narrative_seed: "数以千计的昆虫从丛林深处涌出，它们似乎被某种力量驱使。"

  - id: "swarm_summoned"
    name: "召来的虫群"
    description: "被昆虫学家驱使的虫群向指定区域发动袭击。"
    round_trigger: null
    max_fires: 5
    effects:
      - {type: damage, target: others_at_location, amount: 8}
      - {type: status, target: others_at_location, status: poison, rounds: 3, magnitude: 3}
    narrative_seed: "一群昆虫在神秘力量的驱使下扑向了那片区域！"

  - id: "volcanic_tremor"
    name: "火山震动"
    description: "岛屿的火山开始活跃，地面震动。"
    round_trigger: 15
    weight: 1.0
    effects:
      - {type: damage, target: at_location, location_id: volcano_path, amount: 10}
      - {type: damage, target: at_location, location_id: volcano_crater, amount: 10}
      - {type: set_global_flag, flag: volcano_awakened}
    narrative_seed: "脚下的地面开始剧烈震动，火山口冒出更浓的烟雾。岛屿似乎在苏醒。"

  - id: "ancient_mechanism"
    name: "远古机关"
    description: "遗迹中的某个远古机关被意外触发。"
    round_trigger: 8
    weight: 0.5
    effects:
      - {type: grant_knowledge, source: ruins_inscription, target: at_location, location_id: ancient_ruins}
    narrative_seed: "你听到远处传来石头转动的声音——遗迹中的某个远古机关被触发了。"

  - id: "mysterious_healing"
    name: "神秘治愈"
    description: "岛屿的神秘力量治愈了附近的伤者。"
    round_trigger: 8
    weight: 0.4
    repeatable: true
    max_fires: 3
    effects:
      - {type: heal, target: at_location, location_id: cave_heart, amount: 20}
      - {type: heal, target: at_location, location_id: sacred_grove, amount: 20}
    narrative_seed: "一阵温暖的光芒从地底升起，你感到伤痛在慢慢消退。这座岛屿还有温柔的一面。"
