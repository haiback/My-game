    name: "塔楼顶端"
    description: "遗迹塔楼的顶部，可以俯瞰整座岛屿。这里似乎是一个信号点——如果能找到发射器的话。"
    tags: ["outdoor", "high_ground", "signal_point"]
    connections:
      down: "ancient_ruins"
    coord: [-1, -4]
    travel_costs:
      down: 2
    searchable_items:
      - item_id: "broken_transmitter"
        weight: 1.0
        max_count: 1
      - item_id: "battery"
        weight: 0.5
        max_count: 1
    danger_level: 3

  sacred_grove:
    id: "sacred_grove"
    name: "神圣树丛"
    description: "一片被巨大古树环绕的空地。空气中弥漫着花香，地面上长满了罕见的药用植物。"
    tags: ["outdoor", "water_source", "safe", "herb_rich"]
    connections:
      west: "ancient_ruins"
      north: "volcano_path"
    coord: [2, -3]
    travel_costs:
      west: 2
      north: 2
    searchable_items:
      - item_id: "rare_herb"
        weight: 3.0
        max_count: 5
      - item_id: "poison_dart"
        weight: 1.0
        max_count: 2
      - item_id: "herb"
        weight: 2.0
        max_count: 3
    danger_level: 2

  waterfall:
    id: "waterfall"
    name: "瀑布后方"
    description: "瀑布的水帘后面隐藏着一个小型空间。有人在这里留下了物资。"
    tags: ["indoor", "water_source", "hidden"]
    connections:
      south: "river_crossing"
    coord: [3, -2]
    searchable_items:
      - item_id: "waterproof_bag"
        weight: 1.0
        max_count: 1
      - item_id: "medkit"
        weight: 1.0
        max_count: 1
    danger_level: 2

  highland:
    id: "highland"
    name: "高地瞭望"
    description: "岛屿的高地，可以清晰看到火山口冒出的烟雾。一条小路蜿蜒向下通往火山方向。"
    tags: ["outdoor", "high_ground"]
    connections:
      west: "river_crossing"
      south: "volcano_path"
      north: "cliff_path"
    coord: [3, -3]
    travel_costs:
      west: 2
      south: 2
      north: 3
    searchable_items:
      - item_id: "binoculars"
        weight: 0.5
        max_count: 1
      - item_id: "sharp_stone"
        weight: 2.0
        max_count: 2
    danger_level: 2

  cliff_path:
    id: "cliff_path"
    name: "悬崖小径"
    description: "沿着悬崖边缘的狭窄小径。一侧是万丈深渊，另一侧是陡峭的岩壁。风很大。"
    tags: ["outdoor", "dangerous"]
    connections:
      south: "highland"
      west: "rocky_shore"
    coord: [3, -1]
    travel_costs:
      south: 3
      west: 3
    searchable_items:
      - item_id: "rope"
        weight: 1.5
        max_count: 1
      - item_id: "eagle_feather"
        weight: 0.5
        max_count: 1
    danger_level: 4

  volcano_path:
    id: "volcano_path"
    name: "火山之路"
    description: "通往火山口的灼热小路。地面温热，空气中弥漫着硫磺味。远处传来低沉的轰鸣。"
    tags: ["outdoor", "dangerous", "hot"]
    connections:
      north: "highland"
      south: "sacred_grove"
      up: "volcano_crater"
    coord: [1, -4]
    travel_costs:
      north: 2
      south: 2
      up: 3
    searchable_items:
      - item_id: "sulfur_stone"
        weight: 2.0
        max_count: 3
      - item_id: "obsidian_blade"
        weight: 0.5
        max_count: 1
    danger_level: 5

  volcano_crater:
    id: "volcano_crater"
    name: "火山口"
    description: "火山口的边缘。熔岩在下方翻涌，热浪令人窒息。这里似乎是岛屿一切异象的源头。"
    tags: ["outdoor", "dangerous", "extreme", "ritual_site"]
    connections:
      down: "volcano_path"
    coord: [1, -5]
    travel_costs:
      down: 3
    searchable_items:
      - item_id: "volcanic_core"
        weight: 0.3
        max_count: 1
    danger_level: 7

