id: "island_of_whispers"
name: "低语之岛"
setting: "一座被浓雾笼罩的热带岛屿，传说中隐藏着远古文明的遗迹和致命的秘密。六名幸存者被冲上不同的海岸，他们必须在岛屿的神秘力量吞噬一切之前找到出路——或者成为最后的幸存者。"
intro_text: |
  你从昏迷中醒来，咸涩的海水还残留在嘴角。
  四周是茂密的热带丛林，远处传来不明生物的低吼。
  你的记忆模糊——只记得一场风暴，和一座不该存在的岛屿。
  收音机里反复播放着一段失真的录音：
  "……不要相信任何人……在第30次日落之前……只有一个人能……"
  信号断了。你握紧拳头，站了起来。

player_range: [2, 4]
round_time_seconds: 45
max_rounds: 30

# ── Locations ──────────────────────────────────────────────────
locations:
  beach_camp:
    id: "beach_camp"
    name: "海滩营地"
    description: "一片被冲上来的残骸散落的海滩。椰子树在头顶摇曳，远处能看到岛屿中心的火山。"
    tags: ["outdoor", "water_source", "safe"]
    connections:
      north: "jungle_edge"
      east: "rocky_shore"
    coord: [0, 0]
    travel_costs:
      east: 2
    searchable_items:
      - item_id: "cloth_scrap"
        weight: 3.0
        max_count: 3
      - item_id: "plastic_bottle"
        weight: 2.0
        max_count: 2
      - item_id: "rope"
        weight: 1.0
        max_count: 1
    danger_level: 1

  jungle_edge:
    id: "jungle_edge"
    name: "丛林边缘"
    description: "茂密的热带丛林入口。巨大的蕨类植物遮天蔽日，空气中弥漫着潮湿的泥土味。"
    tags: ["outdoor", "dense_vegetation"]
    connections:
      south: "beach_camp"
      north: "ancient_ruins"
      east: "river_crossing"
      west: "dark_cave"
    coord: [0, -1]
    travel_costs:
      north: 2
      east: 2
      west: 2
    searchable_items:
      - item_id: "herb"
        weight: 3.0
        max_count: 4
      - item_id: "sharp_stone"
        weight: 2.0
        max_count: 2
      - item_id: "vine"
        weight: 2.0
        max_count: 3
    danger_level: 2

  rocky_shore:
    id: "rocky_shore"
    name: "礁石海岸"
    description: "嶙峋的黑色礁石延伸入海。潮汐池里偶尔能看到被困的鱼，但礁石间的裂缝深不见底。"
    tags: ["outdoor", "water_source", "dangerous"]
    connections:
      west: "beach_camp"
      north: "cliff_path"
    coord: [2, 0]
    travel_costs:
      west: 2
      north: 3
    searchable_items:
      - item_id: "rusty_knife"
        weight: 1.0
        max_count: 1
      - item_id: "fish"
        weight: 3.0
        max_count: 3
      - item_id: "salt_crystal"
        weight: 2.0
        max_count: 2
    danger_level: 3

  dark_cave:
    id: "dark_cave"
    name: "幽暗洞穴"
    description: "丛林深处的一个洞穴入口。洞壁上刻着看不懂的符号，深处传来微弱的光芒。"
    tags: ["indoor", "dangerous", "mysterious"]
    connections:
      east: "jungle_edge"
      deep: "cave_heart"
    coord: [-2, -1]
    travel_costs:
      east: 2
      deep: 2
    searchable_items:
      - item_id: "glowing_moss"
        weight: 2.0
        max_count: 2
      - item_id: "ancient_token"
        weight: 0.5
        max_count: 1
    danger_level: 4

  cave_heart:
    id: "cave_heart"
    name: "洞穴之心"
    description: "洞穴最深处，一个巨大的地下空间。中央矗立着一座石制祭坛，上面放着一个散发微光的器物。"
    tags: ["indoor", "mysterious", "ritual_site"]
    connections:
      out: "dark_cave"
    coord: [-2, -3]
    travel_costs:
      out: 2
    searchable_items:
      - item_id: "ritual_artifact"
        weight: 1.0
        max_count: 1
    danger_level: 5

  river_crossing:
    id: "river_crossing"
    name: "河流渡口"
    description: "一条湍急的河流穿过丛林。对岸隐约可见一条小路通向高地。水面下似乎有什么在游动。"
    tags: ["outdoor", "water_source"]
    connections:
      west: "jungle_edge"
      east: "highland"
      north: "waterfall"
    coord: [2, -2]
    travel_costs:
      west: 2
      east: 2
    searchable_items:
      - item_id: "bamboo"
        weight: 3.0
        max_count: 4
      - item_id: "medicinal_fish"
        weight: 1.5
        max_count: 2
    danger_level: 3

  ancient_ruins:
    id: "ancient_ruins"
    name: "远古遗迹"
    description: "被藤蔓覆盖的石制建筑群。墙壁上的浮雕描绘着某种仪式，中央广场有一座坍塌的塔楼。"
    tags: ["outdoor", "mysterious", "ruins"]
    connections:
      south: "jungle_edge"
      up: "tower_top"
      east: "sacred_grove"
    coord: [0, -3]
    travel_costs:
      south: 2
      up: 2
      east: 2
    searchable_items:
      - item_id: "stone_tablet"
        weight: 1.0
        max_count: 2
      - item_id: "ancient_weapon"
        weight: 0.5
        max_count: 1
      - item_id: "cloth_scrap"
        weight: 2.0
        max_count: 2
