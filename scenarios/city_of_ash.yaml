id: "city_of_ash"
name: "终焉之城"
setting: "一座被'黑雾'吞噬的诡异都市。午夜之后，黑雾从城郊荒地涌向市中心，吞没街区、腐蚀血肉。四名'适格者'被困其中，各自背负着不可告人的秘密。黑雾不会停歇——它会在终焉之舞降临前，一寸一寸地吞噬整座城。"
intro_text: |
  你睁开眼，鼻腔里灌进一股铁锈与腐烂混合的气味。
  这不是你熟悉的城市。钟楼在浓雾中若隐若现，街道上散落着被'黑雾'吞没后的痕迹——扭曲的金属、半截的影子。
  远处，一道灰黑色的雾墙正缓慢地、不可阻挡地朝市中心推进。
  某个声音在你脑海中低语：'午夜之后，雾会吞噬一切。活到最后的，只有……'
  声音戛然而止。你攥紧了拳头，这座城市已经不需要规则了。

player_range: [2, 4]
round_time_seconds: 45
max_rounds: 26

# ── Locations ──────────────────────────────────────────────────
# 危险等级(danger_level)表示该区域每回合结束对停留者的腐蚀伤害。
# 中心安全区危险低，城郊'危险区'危险高——黑雾事件会逐层向内推进，
# 逼玩家向市中心收缩，从而发生遭遇战。
locations:
  city_center:
    id: "city_center"
    name: "市中心广场"
    description: "城市的心脏，被一圈低矮护栏环绕。喷泉已经干涸，但这里尚未被黑雾触及——是整座城市最后的庇护所。"
    tags: ["outdoor", "safe", "urban"]
    connections:
      north: "cathedral"
      east: "library"
      south: "metro_station"
      west: "hospital"
      up: "clock_tower"
    searchable_items:
      - item_id: "cloth_scrap"
        weight: 3.0
        max_count: 3
      - item_id: "canned_food"
        weight: 2.0
        max_count: 2
      - item_id: "water"
        weight: 2.0
        max_count: 2
    danger_level: 0

  clock_tower:
    id: "clock_tower"
    name: "钟楼"
    description: "俯瞰全城的高塔。从这里能看清黑雾推进的边界，也藏着可能发出求救信号的零件。"
    tags: ["outdoor", "high_ground", "signal_point"]
    connections:
      down: "city_center"
    searchable_items:
      - item_id: "transmitter_parts"
        weight: 1.0
        max_count: 1
      - item_id: "binoculars"
        weight: 0.5
        max_count: 1
      - item_id: "battery"
        weight: 1.0
        max_count: 1
    danger_level: 1

  cathedral:
    id: "cathedral"
    name: "大教堂"
    description: "尖顶刺破灰雾的古老教堂。彩窗上凝固着某种仪式的图案，长椅间仿佛还残留着低语。"
    tags: ["indoor", "ritual_site", "mysterious"]
    connections:
      south: "city_center"
      west: "graveyard"
      east: "antique_shop"
    searchable_items:
      - item_id: "black_candle"
        weight: 2.0
        max_count: 2
      - item_id: "ritual_grimoire"
        weight: 1.0
        max_count: 1
      - item_id: "herb"
        weight: 2.0
        max_count: 2
    danger_level: 2

  library:
    id: "library"
    name: "旧图书馆"
    description: "书架倾倒、纸张散落一地的图书馆。关于黑雾的记载或许就藏在这片废墟之中。"
    tags: ["indoor", "knowledge"]
    connections:
      west: "city_center"
      east: "old_theater"
      north: "antique_shop"
    searchable_items:
      - item_id: "paper_scrap"
        weight: 3.0
        max_count: 3
      - item_id: "antique_fragment"
        weight: 1.0
        max_count: 1
      - item_id: "herb"
        weight: 2.0
        max_count: 2
    danger_level: 2

  hospital:
    id: "hospital"
    name: "圣心医院"
    description: "空无一人的医院，消毒水的气味还没散去。药品柜被翻得七零八落，但运气好的话还能找到补给。"
    tags: ["indoor", "safe", "medical"]
    connections:
      east: "city_center"
      west: "residential_block"
    searchable_items:
      - item_id: "medkit"
        weight: 1.0
        max_count: 1
      - item_id: "bandage"
        weight: 1.0
        max_count: 1
      - item_id: "herb"
        weight: 3.0
        max_count: 3
    danger_level: 1

  metro_station:
    id: "metro_station"
    name: "地铁站"
    description: "地下月台昏暗潮湿，铁轨伸向未知的黑暗。站台的广播偶尔还会发出刺耳的杂音——这里或许有逃离的路。"
    tags: ["indoor", "escape_point", "urban"]
    connections:
      north: "city_center"
      south: "outskirts"
      east: "warehouse"
    searchable_items:
      - item_id: "rope"
        weight: 2.0
        max_count: 2
      - item_id: "battery"
        weight: 1.0
        max_count: 1
      - item_id: "transmitter_parts"
        weight: 1.0
        max_count: 1
      - item_id: "water"
        weight: 2.0
        max_count: 2
    danger_level: 2

  antique_shop:
    id: "antique_shop"
    name: "古董行"
    description: "摆满真假古玩的铺子，玻璃柜碎了一地。每一件旧物都可能藏着秘密——也可能藏着杀机。"
    tags: ["indoor", "mysterious"]
    connections:
      south: "cathedral"
      west: "library"
      east: "abandoned_factory"
    searchable_items:
      - item_id: "antique_fragment"
        weight: 2.0
        max_count: 2
      - item_id: "cursed_relic"
        weight: 1.0
        max_count: 1
      - item_id: "paper_scrap"
        weight: 2.0
        max_count: 2
    danger_level: 3

  graveyard:
    id: "graveyard"
    name: "郊外墓园"
    description: "歪斜的墓碑隐没在灰雾里，地面被腐蚀得坑坑洼洼。这里是黑雾最早抵达的地方之一。"
    tags: ["outdoor", "mysterious", "dangerous"]
    connections:
      east: "cathedral"
      north: "ruins"
    searchable_items:
      - item_id: "black_candle"
        weight: 2.0
        max_count: 2
      - item_id: "herb"
        weight: 2.0
        max_count: 2
      - item_id: "rusty_knife"
        weight: 1.0
        max_count: 1
    danger_level: 5

  old_theater:
    id: "old_theater"
    name: "破旧剧院"
    description: "红丝绒幕布已经发黑，舞台中央的吊灯摇摇欲坠。黑暗中似乎有无数双眼睛在盯着你。"
    tags: ["indoor", "mysterious"]
    connections:
      west: "library"
      north: "warehouse"
    searchable_items:
      - item_id: "antique_fragment"
        weight: 1.0
        max_count: 1
      - item_id: "cloth_scrap"
        weight: 2.0
        max_count: 2
      - item_id: "glass_shard"
        weight: 2.0
        max_count: 2
    danger_level: 4

  residential_block:
    id: "residential_block"
    name: "居民区"
    description: "门窗紧闭的居民楼，阳台上还晾着没收回的衣服。人去楼空，只留下生活的残影。"
    tags: ["outdoor", "urban"]
    connections:
      east: "hospital"
      south: "outskirts"
      north: "ruins"
    searchable_items:
      - item_id: "canned_food"
        weight: 3.0
        max_count: 3
      - item_id: "cloth_scrap"
        weight: 3.0
        max_count: 3
      - item_id: "water"
        weight: 2.0
        max_count: 2
      - item_id: "leather_coat"
        weight: 1.0
        max_count: 1
    danger_level: 3

  warehouse:
    id: "warehouse"
    name: "旧仓库"
    description: "巨大的仓储空间，货架东倒西歪。金属零件散落一地，是制作工具与武器的好去处。"
    tags: ["indoor", "industrial"]
    connections:
      south: "old_theater"
      west: "metro_station"
    searchable_items:
      - item_id: "battery"
        weight: 1.0
        max_count: 1
      - item_id: "transmitter_parts"
        weight: 1.0
        max_count: 1
      - item_id: "metal_scrap"
        weight: 3.0
        max_count: 3
    danger_level: 4

  abandoned_factory:
    id: "abandoned_factory"
    name: "废弃工厂"
    description: "锈迹斑斑的机器和断裂的传送带。空气中漂浮着铁屑，但也能捡到趁手的家伙。"
    tags: ["indoor", "industrial", "dangerous"]
    connections:
      west: "antique_shop"
      north: "ruins"
    searchable_items:
      - item_id: "metal_scrap"
        weight: 4.0
        max_count: 4
      - item_id: "iron_pipe"
        weight: 2.0
        max_count: 2
      - item_id: "rope"
        weight: 2.0
        max_count: 2
    danger_level: 5

  ruins:
    id: "ruins"
    name: "古老战场遗迹"
    description: "黑雾最浓的地方。断壁残垣之间，某种古老仪式曾在这里上演。这里埋藏着终焉的秘密，也埋藏着死亡。"
    tags: ["outdoor", "ritual_site", "extreme"]
    connections:
      south: "graveyard"
      east: "abandoned_factory"
      west: "residential_block"
    searchable_items:
      - item_id: "cursed_relic"
        weight: 1.0
        max_count: 1
      - item_id: "ritual_dagger"
        weight: 1.0
        max_count: 1
      - item_id: "antique_fragment"
        weight: 1.0
        max_count: 1
    danger_level: 6

  outskirts:
    id: "outskirts"
    name: "城郊荒地"
    description: "城市与荒野的交界，黑雾正是从这里涌入。踏足此地，你能感到雾气啃噬着皮肤。"
    tags: ["outdoor", "extreme", "dangerous"]
    connections:
      north: "metro_station"
      west: "residential_block"
    searchable_items:
      - item_id: "iron_pipe"
        weight: 1.0
        max_count: 1
      - item_id: "metal_scrap"
        weight: 2.0
        max_count: 2
      - item_id: "herb"
        weight: 1.0
        max_count: 1
    danger_level: 6

