  cursed_relic:
    id: "cursed_relic"
    name: "诅咒遗物"
    kind: "key"
    description: "被黑雾腐蚀过的古老遗物，是开启终焉之舞的钥匙。"
  binoculars:
    id: "binoculars"
    name: "望远镜"
    kind: "material"
    description: "能远距离观察黑雾边界与敌情的望远镜。"

# ── Recipes ────────────────────────────────────────────────────
recipes:
  - output_item_id: "bandage"
    inputs: {cloth_scrap: 2}

  - output_item_id: "jagged_blade"
    inputs: {metal_scrap: 2, iron_pipe: 1, rope: 1}

  - output_item_id: "riot_shield"
    inputs: {metal_scrap: 2, leather_coat: 1}

  - output_item_id: "antidote"
    inputs: {herb: 2, water: 1}

  - output_item_id: "escape_key"
    inputs: {antique_fragment: 2}

  - output_item_id: "signal_flare"
    inputs: {battery: 1, transmitter_parts: 1, metal_scrap: 1}

# ── Knowledge Sources ──────────────────────────────────────────
knowledge_sources:
  - id: "fog_lore"
    name: "黑雾规律"
    description: "你在图书馆的残页中读到了黑雾的成因，你的防御直觉提升了。"
    acquisition: "search"
    location_id: "library"
    weight: 0.6
    grants_knowledge: ["fog_lore"]
    stat_bonus: {defense: 2}

  - id: "ritual_cipher"
    name: "仪式符文"
    description: "你破解了教堂彩窗上的符文，理解了终焉之舞的真相。"
    acquisition: "search"
    location_id: "cathedral"
    weight: 0.5
    grants_knowledge: ["ritual_cipher"]

  - id: "first_aid"
    name: "急救术"
    description: "亲手包扎让你掌握了基础的急救技巧。"
    acquisition: "craft"
    item_id: "bandage"
    grants_knowledge: ["first_aid"]

  - id: "escape_map"
    name: "逃生地图"
    description: "你摸清了地铁站的暗道，行动更加敏捷。"
    acquisition: "search"
    location_id: "metro_station"
    weight: 0.5
    grants_knowledge: ["escape_map"]
    stat_bonus: {speed: 2}

# ── Characters ─────────────────────────────────────────────────
characters:
  - id: "soldier"
    name: "雷"
    backstory: |
      前特种兵，被派来执行一次不该存在的任务，醒来时城市已被黑雾吞没。
      多年的战场直觉告诉你：在这座城里，规则只有一条——先下手为强。
      只有消灭所有其他幸存者，你才能活着离开。
    narration_style: "冷静警觉的军人视角：多用战场直觉、威胁评估、战术推演等措辞，短促有力，句句如命令。"
    focus: "你更在意威胁与战术：关注其他幸存者的动向、武器的优劣、可伏击的时机与地形，以及自身的战斗状态。"
    base_stats:
      hp: 120
      max_hp: 120
      stamina: 100
      max_stamina: 100
      attack: 18
      defense: 12
      speed: 8
    start_location: "city_center"
    start_inventory: {rusty_knife: 1}
    secret_objective: "消灭所有其他幸存者，确保这座城市的秘密不会泄露出去。"
    victory_condition:
      kind: "eliminate_all"
      params: {}
    abilities:
      - id: "shock_assault"
        name: "破甲突袭"
        description: "消耗体力发动一次迅猛突袭，造成 16 点伤害。"
        stamina_cost: 18
        cooldown_rounds: 4
        target: "single"
        effects:
          - {type: damage, target: single, amount: 16}

  - id: "cultist"
    name: "苏"
    backstory: |
      邪教徒，真名早已被遗忘在某个幽暗的角落。
      黑雾不是灾难，而是恩赐。你比任何人都清楚——终焉之舞才是唯一的救赎。
      收集仪式祭器，在黑雾彻底苏醒之时，完成那场古老的仪式。
    narration_style: "神秘宿命的邪教视角：多用低语、献祭、黑雾、终焉等措辞，朦胧而虔诚，仿佛在诉说预言。"
    focus: "你更在意黑雾与仪式：关注黑雾的涨落与征兆、祭器与符文的线索、终焉之舞的临近，以及他人对神圣仪式的威胁。"
    base_stats:
      hp: 100
      max_hp: 100
      stamina: 110
      max_stamina: 110
      attack: 12
      defense: 8
      speed: 9
    start_location: "cathedral"
    start_inventory: {black_candle: 1}
    secret_objective: "取得仪式匕首(ritual_dagger)与诅咒遗物(cursed_relic)，在黑雾苏醒(fog_awakened)时回到大教堂(cathedral)完成终焉仪式。"
    victory_condition:
      kind: "custom_flag"
      params:
        required_items: ["ritual_dagger", "cursed_relic"]
        at_location: "cathedral"
        required_flags: ["fog_awakened"]
    abilities:
      - id: "black_fog_whisper"
        name: "黑雾低语"
        description: "以黑雾之力侵蚀一名对手所在区域的其他人，使其中毒。"
        stamina_cost: 20
        cooldown_rounds: 5
        target: "single"
        effects:
          - {type: trigger_event, event_id: cultist_summoned}

  - id: "thief"
    name: "柯"
    backstory: |
      盗墓者兼古董商人，靠眼力吃饭，从不会把自己置于死地。
      你一眼就看出，地铁站深处藏着一条逃生的暗道——只是需要钥匙和信号。
      收集逃生钥匙和信号弹，在黑雾吞没一切之前离开这里。
    narration_style: "精明谨慎的盗墓者视角：多用估量、线索、机关、退路等措辞，冷静而务实，处处给自己留后路。"
    focus: "你更在意物资与逃生：关注值钱的古董、可合成的零件、暗藏的机关与退路，以及离地铁站逃生装置还差什么。"
    base_stats:
      hp: 90
      max_hp: 90
      stamina: 115
      max_stamina: 115
      attack: 8
      defense: 8
      speed: 12
    start_location: "antique_shop"
    start_inventory: {antique_fragment: 1}
    secret_objective: "收集逃生钥匙(escape_key)和信号弹(signal_flare)，到达地铁站(metro_station)启动逃生装置离开。"
    victory_condition:
      kind: "escape"
      params:
        required_items: ["escape_key", "signal_flare"]
        at_location: "metro_station"
    abilities:
      - id: "lockpick_intuition"
        name: "开锁直觉"
        description: "多年的盗墓经验让你身法愈发灵活，永久提升 2 点速度。"
        stamina_cost: 12
        cooldown_rounds: 5
        target: "self"
        effects:
          - {type: stat_bonus, stat: speed, amount: 2, target: self}

  - id: "doctor"
    name: "林"
    backstory: |
      心理医生，在末日的废墟里仍然保持着冷静。
      你相信救援终会到来——只要能熬过黑雾最浓的这几夜。
      活下去，等到天亮。
    narration_style: "冷静观察的心理医生视角：多用观察、呼吸、创伤、时间等措辞，克制而富有同理心，却在危险前格外清醒。"
    focus: "你更在意生存与庇护：关注药品与安全地带、身体与精神的状态、可避难的位置，以及黑雾对生命的侵蚀节奏。"
    base_stats:
      hp: 95
      max_hp: 95
      stamina: 105
      max_stamina: 105
      attack: 7
      defense: 9
      speed: 10
    start_location: "hospital"
    start_inventory: {herb: 2}
    secret_objective: "熬过黑雾最浓的夜晚，存活到第 22 回合，等待救援降临。"
    victory_condition:
      kind: "survive_rounds"
      params: {rounds: 22}
    abilities:
      - id: "emergency_triage"
        name: "紧急救治"
        description: "为自己做紧急处理，恢复 25 点生命。"
        stamina_cost: 14
        cooldown_rounds: 4
        target: "self"
        effects:
          - {type: heal, amount: 25, target: self}

# ── Random Events ──────────────────────────────────────────────
# 黑雾事件随回合递增、逐层向内推进：从城郊 → 中环 → 内环 → 全城，
# 形成"缩圈"般的生存压力。fog_awakening 会置起全局旗标 fog_awakened，
# 供邪教徒的 custom_flag 胜利条件引用。
random_events:
  - id: "fog_whisper"
    name: "黑雾初现"
    description: "黑雾从城郊涌入，最先腐蚀最外围的区域。"
    round_trigger: 4
    weight: 1.0
    effects:
      - {type: damage, target: at_location, location_id: outskirts, amount: 6}
      - {type: damage, target: at_location, location_id: ruins, amount: 6}
      - {type: damage, target: at_location, location_id: graveyard, amount: 6}
    narrative_seed: "灰黑色的雾墙越过了城郊，外围的街区开始被腐蚀。"

  - id: "fog_spread"
    name: "黑雾蔓延"
    description: "黑雾继续向中环推进，工业区与剧院被雾气吞没。"
    round_trigger: 8
    weight: 1.0
    effects:
      - {type: damage, target: at_location, location_id: warehouse, amount: 8}
      - {type: damage, target: at_location, location_id: old_theater, amount: 8}
      - {type: damage, target: at_location, location_id: abandoned_factory, amount: 8}
      - {type: damage, target: at_location, location_id: residential_block, amount: 8}
    narrative_seed: "黑雾越过了中环，废弃的街区在雾中发出碎裂的声响。"

  - id: "fog_surge"
    name: "黑雾逼近"
    description: "黑雾直逼内环，雾气开始侵蚀教堂与图书馆。"
    round_trigger: 12
    weight: 1.0
    effects:
      - {type: damage, target: at_location, location_id: cathedral, amount: 8}
      - {type: damage, target: at_location, location_id: library, amount: 8}
      - {type: damage, target: at_location, location_id: antique_shop, amount: 8}
      - {type: damage, target: at_location, location_id: metro_station, amount: 8}
      - {type: status, target: at_location, location_id: cathedral, status: poison, rounds: 3, magnitude: 3}
    narrative_seed: "黑雾逼近内环，连空气中都弥漫着腐蚀性的毒素。"

  - id: "fog_swallow"
    name: "黑雾吞城"
    description: "黑雾第一次吞没了整座城市，无人幸免。"
    round_trigger: 16
    weight: 1.0
    effects:
      - {type: damage, target: all, amount: 10}
    narrative_seed: "黑雾吞没了整座城市，所有人都感到血肉在被啃噬。"

  - id: "fog_awakening"
    name: "终焉之舞"
    description: "黑雾彻底苏醒，终焉之舞降临。古老仪式的大门被打开了。"
    round_trigger: 18
    weight: 1.0
    effects:
      - {type: damage, target: all, amount: 12}
      - {type: set_global_flag, flag: fog_awakened}
    narrative_seed: "钟声自鸣，黑雾化作无数舞动的人影——终焉之舞，开始了。"

  - id: "fog_mercy"
    name: "雾中恩赐"
    description: "黑雾偶尔也会网开一面，庇护所里的伤者得到了片刻喘息。"
    round_trigger: 10
    weight: 0.5
    repeatable: true
    max_fires: 2
    effects:
      - {type: heal, target: at_location, location_id: hospital, amount: 20}
      - {type: heal, target: at_location, location_id: city_center, amount: 20}
    narrative_seed: "黑雾在庇护所外徘徊，却迟迟没有侵入，你感到一丝诡异的平静。"

  - id: "cultist_summoned"
    name: "黑雾低语"
    description: "被邪教徒驱使的黑雾侵蚀了指定区域的其他人。"
    round_trigger: null
    max_fires: 5
    effects:
      - {type: damage, target: others_at_location, amount: 10}
      - {type: status, target: others_at_location, status: poison, rounds: 3, magnitude: 3}
    narrative_seed: "黑雾化作低语，扑向了那片区域的其他人！"
