  escape_key:
    id: "escape_key"
    name: "逃生钥匙"
    kind: "key"
    description: "用古董碎片拼合的钥匙，能启动地铁站深处的逃生装置。"
  signal_flare:
    id: "signal_flare"
    name: "信号弹"
