[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mygame"
version = "0.1.0"
description = "Multiplayer text adventure duel game with AI Game Master"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13.0",
]
client = [
    "rich>=13.0",
    "websockets>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mygame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: slow tests that require a running Ollama server with the required models",
]
